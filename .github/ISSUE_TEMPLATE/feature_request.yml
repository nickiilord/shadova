name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先说清「为什么」——描述痛点与使用场景，而不只是给出方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的方案
      description: 如果已有实现思路，欢迎一并说明
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 预计影响范围
      options:
        - label: 数据库结构（需同步 docs/database/schema.sql）
        - label: API 契约（需重生成 openapi.json 与两端 schema.d.ts）
        - label: 权限码（需种子 / 中间件 / 前端三处联动）
        - label: 新增页面或菜单
    validations:
      required: false
