name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望的结果是什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 用 admin / Admin@123 登录管理端
        2. 进入「系统管理 → 用户管理」
        3. 点击「新增用户」并提交
        4. 观察到 ...
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: 数据库
      options:
        - SQLite（默认）
        - MySQL
        - PostgreSQL
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: 提交版本
      description: "`git rev-parse --short HEAD` 的输出"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: API 控制台输出、浏览器报错、失败截图等
    validations:
      required: false
