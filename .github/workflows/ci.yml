name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  # Prisma 相对路径按 schema 目录（packages/db/prisma）解析：generate 仅需变量存在，CI 不写 dev.db
  DATABASE_URL: file:./dev.db
  # api 集成测试专用库：apps/api/test/setup.ts 在每个测试进程启动前 force-reset 重建，与开发库隔离
  TEST_DATABASE_URL: file:./test.db
  HUSKY: "0"

jobs:
  quality:
    name: Test, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated API artifacts
        run: |
          pnpm --filter @repo/db generate
          pnpm --filter @repo/api generate:openapi
          pnpm --filter @repo/api generate:types
          pnpm --filter @repo/portal generate:types
          pnpm --filter @repo/mcp generate:types
          git diff --exit-code -- apps/api/openapi.json apps/web/src/api/schema.d.ts apps/portal/src/api/schema.d.ts apps/mcp/src/api/schema.d.ts

      - name: Lint
        run: pnpm turbo lint && pnpm lint:e2e

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm turbo test

      - name: Build
        run: pnpm turbo build

  # 完全按 README「快速开始」执行一次，不复用任何预置产物。
  # quality / e2e 都跑在"已构建、已配置"的环境里，发现不了"文档步骤与代码要求不一致"——
  # 这个 job 就是那道防线。
  quickstart:
    name: Quick start (fresh-clone smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # README 步骤：复制 .env（这些文件被 gitignore，检出后不存在）
      - name: Copy env files
        run: |
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env
          cp packages/db/.env.example packages/db/.env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # README 步骤：建库 + 种子（不预先 build，验证脚本自身可用）
      - name: Push schema and seed
        run: |
          pnpm --filter @repo/db db:push
          pnpm --filter @repo/db seed

      # README 步骤：启动开发服务，轮询等待三个端就绪
      - name: Start dev servers
        run: |
          pnpm dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/api/health > /dev/null \
              && curl -sf http://localhost:5173 > /dev/null \
              && curl -sf http://localhost:5174 > /dev/null; then
              echo "OK 三个端已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL 服务未在 120 秒内就绪"
          exit 1

      # 冒烟：登录（验证数据库与种子）+ 经代理访问（验证同源链路，而非仅直连 API）
      - name: Smoke test
        run: |
          status=$(curl -s -o /tmp/login.json -w "%{http_code}" \
            -X POST http://localhost:3001/api/auth/login \
            -H "content-type: application/json" \
            -d '{"username":"admin","password":"Admin@123"}')
          echo "登录接口 HTTP $status"
          [ "$status" = "200" ] || { echo "FAIL 登录失败"; cat /tmp/login.json; exit 1; }

          curl -sf http://localhost:5173/api/health > /dev/null
          echo "OK 管理端 Vite 代理 /api 可达"
          curl -sf http://localhost:5174/api/portal/home > /dev/null
          echo "OK 门户 Vite 代理 /api 可达"

      - name: Show dev log on failure
        if: failure()
        run: tail -100 /tmp/dev.log

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # webServer 由 e2e/playwright.config.ts 自起 api（独立 e2e.db）+ web（vite dev），
      # CI 下 reuseExistingServer=false 强制自起；global-setup 每次 force-reset 重建 e2e 库
      - name: Run E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
