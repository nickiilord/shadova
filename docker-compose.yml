# 一键启动：docker compose up -d --build
# - web: http://localhost:5173（管理端：nginx 静态 + /api 反代）
# - portal: http://localhost:5174（公开门户：nginx 静态 + /api 反代）
# - api: http://localhost:3001
# - SQLite 数据持久化到 db-data 卷；首次启动自动建表 + 种子（admin / Admin@123）
# - JWT_SECRET 未设置时容器入口自动生成随机密钥并持久化到数据卷；也可显式设置（至少 32 字符）
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-api
    environment:
      DATABASE_URL: "file:/app/data/shard.db"
      # 留空时由 docker-entrypoint.sh 自动生成随机密钥并持久化到 db-data 卷；
      # 显式覆盖请设置宿主环境变量 JWT_SECRET（至少 32 字符随机串）
      JWT_SECRET: "${JWT_SECRET:-}"
      AUTH_PROVIDER: "local"
      NODE_ENV: "production"
      PORT: "3001"
      UPLOAD_DIR: "/app/data/uploads"
    volumes:
      - db-data:/app/data
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-web
    depends_on:
      - api
    ports:
      - "5173:80"

  portal:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-portal
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  db-data:
